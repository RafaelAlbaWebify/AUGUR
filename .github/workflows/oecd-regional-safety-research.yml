name: AUGUR OECD Regional Safety Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/scripts/inspect_oecd_regional_safety.py"
      - ".github/workflows/oecd-regional-safety-research.yml"

concurrency:
  group: augur-oecd-regional-safety-research
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Inspect OECD Australia regional safety measures
        run: python -m scripts.inspect_oecd_regional_safety
