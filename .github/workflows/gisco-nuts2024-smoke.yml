name: Official GISCO NUTS2 Smoke
on:
  pull_request:
    paths:
      - 'backend/app/ingestion/eurostat_nuts_registry.py'
      - 'backend/scripts/smoke_nuts2024_registry.py'
      - '.github/workflows/gisco-nuts2024-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/ingestion/eurostat_nuts_registry.py'
      - 'backend/scripts/smoke_nuts2024_registry.py'
      - '.github/workflows/gisco-nuts2024-smoke.yml'
  workflow_dispatch:
jobs:
  official-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.27,<1'
      - name: Validate real official NUTS 2024 level-2 GeoJSON
        working-directory: backend
        run: python -m scripts.smoke_nuts2024_registry
