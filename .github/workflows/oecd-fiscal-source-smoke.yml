name: OECD Fiscal Source Smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "25 6 * * 1"
jobs:
  official-tax-wedge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install "httpx>=0.27,<1"
      - name: Query official OECD data, fail on schema mismatch
        working-directory: backend
        run: python -m scripts.smoke_oecd_tax_wedge
