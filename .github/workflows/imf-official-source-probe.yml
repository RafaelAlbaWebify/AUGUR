name: IMF official WEO source contract probe
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/scripts/probe_imf_weo_workbook.py"
      - ".github/workflows/imf-official-source-probe.yml"
  workflow_dispatch:
jobs:
  source-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install official XLSX probe dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Inspect WEO original workbook (read-only)
        working-directory: backend
        run: python -m scripts.probe_imf_weo_workbook
