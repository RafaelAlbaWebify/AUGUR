name: Live Eurostat Regional Coverage Smoke

on:
  pull_request:
    paths:
      - 'backend/app/ingestion/eurostat_geography_discovery.py'
      - 'backend/app/ingestion/eurostat_nuts_registry.py'
      - 'backend/app/ingestion/eurostat_regional_housing.py'
      - 'backend/app/ingestion/eurostat_regional_labour.py'
      - 'backend/scripts/smoke_eurostat_regional_coverage.py'
      - '.github/workflows/eurostat-regional-coverage-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/ingestion/eurostat_geography_discovery.py'
      - 'backend/app/ingestion/eurostat_nuts_registry.py'
      - 'backend/app/ingestion/eurostat_regional_housing.py'
      - 'backend/app/ingestion/eurostat_regional_labour.py'
      - 'backend/scripts/smoke_eurostat_regional_coverage.py'
      - '.github/workflows/eurostat-regional-coverage-smoke.yml'
  workflow_dispatch:

jobs:
  live-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Query real Eurostat datasets and reconcile against GISCO NUTS 2024
        working-directory: backend
        run: python -m scripts.smoke_eurostat_regional_coverage
