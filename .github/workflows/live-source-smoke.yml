name: AUGUR Live Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/ingestion/eurostat_regional_*.py"
      - "backend/app/ingestion/eurostat.py"
      - "backend/app/services/city_evidence.py"
      - "backend/scripts/inspect_eurostat_city_evidence.py"
      - "backend/scripts/inspect_global_country_baseline.py"
      - "backend/scripts/inspect_oecd_regional_density.py"
      - "backend/scripts/inspect_oecd_fua_density.py"
      - "backend/scripts/inspect_oecd_fua_boundaries.py"
      - "backend/scripts/inspect_oecd_fua_geometry_links.py"
      - "backend/scripts/inspect_oecd_fua_dependency.py"
      - "backend/scripts/inspect_oecd_fua_green_area.py"
      - "backend/scripts/inspect_oecd_fua_labour.py"
      - "backend/scripts/inspect_oecd_fua_economy.py"
      - "backend/scripts/inspect_oecd_fua_public_transport.py"
      - "backend/scripts/inspect_oecd_fua_commute_mode.py"
      - "backend/scripts/inspect_oecd_fua_pollution.py"
      - "backend/scripts/inspect_oecd_regional_demography.py"
      - "backend/scripts/inspect_oecd_regional_population.py"
      - "backend/scripts/inspect_oecd_regional_labour.py"
      - "backend/scripts/inspect_oecd_regional_gdp.py"
      - "backend/scripts/inspect_oecd_regional_income.py"
      - "backend/app/ingestion/world_bank.py"
      - "backend/app/ingestion/imf.py"
      - "backend/app/ingestion/un_wpp.py"
      - "backend/app/ingestion/oecd_regional.py"
      - "backend/app/ingestion/oecd_fua.py"
      - "backend/scripts/sync_oecd_regional_density.py"
      - "backend/scripts/sync_oecd_regional.py"
      - "backend/scripts/sync_oecd_fua.py"
      - "backend/app/ingestion/eea_*.py"
      - "backend/app/ingestion/gisco_cities.py"
      - "backend/app/ingestion/cedefop_clssi.py"
      - "backend/app/ingestion/cedefop_oja_imbalance.py"
      - "backend/app/ingestion/cedefop_reset.py"
      - "backend/scripts/inspect_eurostat_regional_*.py"
      - "backend/scripts/*eea*.py"
      - "backend/scripts/inspect_*gisco*.py"
      - "backend/scripts/inspect_cedefop_clssi.py"
      - "backend/scripts/import_cedefop_clssi.py"
      - "backend/scripts/import_cedefop_oja_imbalance.py"
      - "backend/scripts/inspect_cedefop_reset.py"
      - "backend/scripts/sync_eurostat_regional_*.py"
      - "backend/scripts/*nuts3*.py"
      - ".github/workflows/live-source-smoke.yml"
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: augur-live-source-smoke
  cancel-in-progress: true

jobs:
  eurostat-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Probe global country catalog and World Bank batch
        run: python -m scripts.inspect_global_country_baseline --source world_bank

      - name: Probe global IMF batch
        run: python -m scripts.inspect_global_country_baseline --source imf

      - name: Probe global UN WPP batch
        run: python -m scripts.inspect_global_country_baseline --source un_wpp

      - name: Inspect OECD regional density
        run: python -m scripts.inspect_oecd_regional_density

      - name: Inspect OECD regional population
        run: python -m scripts.inspect_oecd_regional_population

      - name: Inspect OECD regional demography
        run: python -m scripts.inspect_oecd_regional_demography

      - name: Inspect OECD regional labour rates
        run: python -m scripts.inspect_oecd_regional_labour

      - name: Inspect OECD regional GDP per capita PPP
        run: python -m scripts.inspect_oecd_regional_gdp

      - name: Inspect OECD regional disposable income PPP
        run: python -m scripts.inspect_oecd_regional_income

      - name: Sync OECD Australia regional demographics
        run: >-
          python -m scripts.sync_oecd_regional
          --countries AUS
          --start-year 2021

      - name: Inspect OECD Australia FUA density
        run: python -m scripts.inspect_oecd_fua_density

      - name: Inspect official OECD city and FUA boundaries
        run: python -m scripts.inspect_oecd_fua_boundaries

      - name: Discover current OECD FUA geometry links
        run: python -m scripts.inspect_oecd_fua_geometry_links

      - name: Inspect OECD Australia urban dependency ratio
        run: python -m scripts.inspect_oecd_fua_dependency

      - name: Inspect OECD Sydney FUA green-area measures
        run: python -m scripts.inspect_oecd_fua_green_area

      - name: Inspect OECD Australia FUA labour market
        run: python -m scripts.inspect_oecd_fua_labour

      - name: Inspect OECD Australia FUA labour productivity
        run: python -m scripts.inspect_oecd_fua_economy

      - name: Inspect OECD Australia FUA public transport access
        run: python -m scripts.inspect_oecd_fua_public_transport

      - name: Inspect OECD Australia urban commute modes
        run: python -m scripts.inspect_oecd_fua_commute_mode

      - name: Inspect OECD Australia FUA PM2.5 exposure
        run: python -m scripts.inspect_oecd_fua_pollution

      - name: Sync representative OECD non-EU urban evidence
        run: >-
          python -m scripts.sync_oecd_fua
          --countries AUS CAN USA JPN
          --start-year 2020

      - name: Probe Urban Audit city evidence
        run: python -m scripts.inspect_eurostat_city_evidence

      - name: Inspect Cedefop CLSSI workbook
        run: python -m scripts.inspect_cedefop_clssi

      - name: Import Cedefop CLSSI workbook
        run: python -m scripts.import_cedefop_clssi

      - name: Import Cedefop OJA imbalance
        run: python -m scripts.import_cedefop_oja_imbalance

      - name: Inspect Cedefop RESET workbook
        run: python -m scripts.inspect_cedefop_reset

      - name: Inspect regional JVS schema
        run: python -m scripts.inspect_eurostat_regional_jvs --period 2026-Q2

      - name: Sync regional labour evidence
        run: python -m scripts.sync_eurostat_regional_labour

      - name: Sync regional sector evidence
        run: python -m scripts.sync_eurostat_regional_sector

      - name: Inspect regional housing and income schemas
        run: python -m scripts.inspect_eurostat_regional_housing

      - name: Sync regional housing and income evidence
        run: python -m scripts.sync_eurostat_regional_housing

      - name: Inspect regional healthcare schemas
        run: python -m scripts.inspect_eurostat_regional_health

      - name: Sync regional healthcare evidence
        run: python -m scripts.sync_eurostat_regional_health

      - name: Inspect regional access and safety schemas
        run: python -m scripts.inspect_eurostat_regional_access_safety

      - name: Probe NUTS3 context
        run: python -m scripts.probe_eurostat_nuts3_context

      - name: Inspect legacy EEA PM2.5 station coverage
        continue-on-error: true
        run: python -m scripts.inspect_eea_pm25

      - name: Inspect modern EEA Air Quality API
        run: python -m scripts.inspect_eea_air_quality_api

      - name: Inspect EEA PM2.5 health-burden dataset
        run: python -m scripts.inspect_eea_health_burden

      - name: Sync EEA PM2.5 health-burden evidence
        run: python -m scripts.sync_eea_health_burden

      - name: Probe verified PM2.5 for Oviedo
        run: python -m scripts.probe_eea_pm25_city --city Oviedo --country ES --year 2024

      - name: Inspect one verified PM2.5 parquet
        run: python -m scripts.inspect_eea_pm25_parquet

      - name: Inspect EEA to Urban Audit city mapping
        run: python -m scripts.inspect_eea_gisco_city_mapping

      - name: Aggregate verified PM2.5 for Oviedo
        run: python -m scripts.aggregate_eea_city_pm25 --city Oviedo --country ES --year 2024
