name: OECD population source contract probe
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/scripts/probe_oecd_population_contract.py"
      - ".github/workflows/oecd-population-contract-probe.yml"
  workflow_dispatch:
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Inspect OECD raw statistical dimensions without writing
        working-directory: backend
        run: python -m scripts.probe_oecd_population_contract
