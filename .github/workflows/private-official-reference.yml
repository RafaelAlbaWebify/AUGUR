name: Public official-data reference validation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'backend/scripts/build_official_reference_db.py'
      - 'backend/scripts/audit_official_reference_db.py'
      - 'backend/scripts/verify_reference_app_readthrough.py'
      - '.github/workflows/private-official-reference.yml'

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Validate ingestion regression tests
        working-directory: backend
        run: python -m pytest -q tests/test_eurostat_fail_closed_values.py tests/test_regional_ingestion_dimension_safety.py tests/test_eurostat_regional_contract.py tests/test_official_reference_db_audit.py
      - name: Build independent official-source DuckDB
        working-directory: backend
        run: python -m scripts.build_official_reference_db --db ../reference-output/official_eurostat_reference.duckdb --report ../reference-output/reference_report.json
      - name: Independently audit persisted DuckDB observations
        working-directory: backend
        run: python -m scripts.audit_official_reference_db --db ../reference-output/official_eurostat_reference.duckdb --report ../reference-output/database_audit.json
      - name: Verify official reference through real application DuckDB and public HTTP route
        working-directory: backend
        run: python -m scripts.verify_reference_app_readthrough --reference-db ../reference-output/official_eurostat_reference.duckdb --report ../reference-output/app_readthrough_audit.json
      - name: Upload public-source reference data and acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: official-reference-${{ github.run_id }}
          path: reference-output/
          retention-days: 7
          if-no-files-found: error
